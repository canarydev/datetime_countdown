<h2>Datetime Countdown Widget</h2>
<p>Display a live countdown for Datetime fields in Odoo forms, lists, and kanban cards.</p>
<p>Less than 24 hours is shown as HH:MM:SS; longer ranges are shown as days, months, or years.</p>
<p>Use it with <code>widget="datetime_countdown"</code> on any <code>datetime</code> field.</p>
</section>
